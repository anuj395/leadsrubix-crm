name: Deploy to AWS EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy to AWS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/Leads-Rubix-CRM
            git fetch origin prod
            git reset --hard origin/prod
            pnpm install --no-frozen-lockfile
            PORT=3000 pnpm run build
            mkdir -p build dist/public
            cp -r artifacts/web/dist/public/* build/ 2>/dev/null || true
            cp -r artifacts/web/dist/public/* dist/public/ 2>/dev/null || true
            pm2 restart api-server || pm2 start artifacts/api-server/src/index.js --name "api-server"
            sudo systemctl reload nginx 2>/dev/null || true

