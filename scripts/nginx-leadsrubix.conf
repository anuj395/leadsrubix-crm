# /etc/nginx/sites-available/default or /etc/nginx/sites-available/leadsrubix
# Leads Rubix Enterprise CRM — Direct IP & Domain Nginx Configuration

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /home/ubuntu/Leads-Rubix-CRM/build;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Frontend Single Page App Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend Reverse Proxy (Node.js API Server on port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Uploaded media files
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }
}
